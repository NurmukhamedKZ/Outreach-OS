# Тот же контур, что и `README.md`: два процесса, browser'у нужен только 3000.
# writer — не отдельный сервис: его роутер монтируется в api.py (collector/api.py),
# а .venv собирается тем же образом backend'а, потому что операции системы 2
# вызываются в том же процессе воркера джобов (services/jobs.py), а writer
# монтируется через sys.path.
#
# Перед первым запуском: cp collector/.env.example collector/.env и вписать ключи —
# без них поднимутся сбор/пересборка/веб, но не analyze.* и probe.serp.
#
#   docker compose up --build

services:
  backend:
    build:
      context: .
      dockerfile: collector/Dockerfile
    ports:
      - "8787:8787"
    env_file:
      - path: collector/.env
        required: false
    volumes:
      # Сырьё и базы — невосстановимые или производные слои (см. CLAUDE.md),
      # им место на хосте, а не в слоях образа.
      - ./collector/data:/app/collector/data
      - ./collector/config.toml:/app/collector/config.toml
      - ./collector/.env:/app/collector/.env
      - ./writer/config.toml:/app/writer/config.toml
      - ./writer/.env:/app/writer/.env

  frontend:
    build:
      context: ./frontend
      args:
        # Имя сервиса compose, не localhost: контейнеры друг для друга — хосты.
        API_ORIGIN: http://backend:8787
    ports:
      - "3001:3000"
    depends_on:
      - backend