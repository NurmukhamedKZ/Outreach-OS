# Тот же контур, что и `README.md`: два процесса, browser'у нужен только 3000.
# writer — не отдельный сервис: его роутер монтируется в api.py (backend/collector/api.py),
# а venv у него общий с collector'ом (backend/pyproject.toml), потому что операции системы 2
# вызываются в том же процессе воркера джобов (collector/services/jobs.py).
#
# Перед первым запуском: cp collector/.env.example collector/.env и вписать ключи —
# без них поднимутся сбор/пересборка/веб, но не analyze.* и probe.serp.
#
#   docker compose up --build

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8787:8787"
    env_file:
      - path: backend/collector/.env
        required: false
    volumes:
      # Сырьё и базы — невосстановимые или производные слои (см. CLAUDE.md),
      # им место на хосте, а не в слоях образа.
      - ./backend/collector/data:/app/collector/data
      - ./backend/collector/config.toml:/app/collector/config.toml
      - ./backend/collector/.env:/app/collector/.env
      - ./backend/writer/config.toml:/app/writer/config.toml
      - ./backend/writer/.env:/app/writer/.env

  frontend:
    build:
      context: ./frontend
      args:
        # Имя сервиса compose, не localhost: контейнеры друг для друга — хосты.
        API_ORIGIN: http://backend:8787
    ports:
      - "3001:3000"
    depends_on:
      - backend