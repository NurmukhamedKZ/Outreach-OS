# Единственное место, где живут рубрики, города, slug'и, веса и чёрный список.
# Читается через tomllib (stdlib). Ни один скрипт не хардкодит эти значения у себя.

cities = ["almaty", "astana"]

[rubrics]
# Листовые рубрики ветки 110609 «B2B-услуги», отобранные под ICP из BRD §4:
# компании, которые сами продают B2B — бухгалтерия, право, HR, IT-аутсорс,
# консалтинг. Источник — raw_jsonl_legacy/2gis_rubrics.jsonl, без похода в сеть.
# Лист = id, который ни разу не встретился как parent_id.
#
# include — белый список: рубрика, которой тут нет, в сбор не попадает вообще.
# Именно он, а не exclude, гарантирует, что конкуренты не просочатся.
include = [
  # 110613 «Бизнес-услуги» — ядро ICP
  653,     # Бухгалтерские услуги
  339,     # Аудиторские услуги
  1238,    # Управленческий консалтинг
  1236,    # Финансовый консалтинг
  638,     # Регистрация и ликвидация предприятий
  22129,   # Call-центры
  51322,   # Ресторанный консалтинг
  110472,  # Фитнес-консалтинг
  50374,   # Тендеры и аукционы
  21302,   # Организация внешнеэкономической деятельности
  110447,  # Организация бизнес-мероприятий
  942,     # Организация выставок
  112587,  # Услуги маркировки товаров
  110416,  # Фулфилмент
  103405,  # Экспертиза проектной документации и инженерных изысканий
  103135,  # Аттестация рабочих мест
  99200,   # Независимая инвентаризация
  110429,  # Аутсорсинг печати
  110511,  # Автоматизация обучения

  # 110614 «Автоматизация» — IT-аутсорс и интеграторы
  527,     # Автоматизация бизнес-процессов
  328,     # Автоматизация производства
  1235,    # Автоматизация торговли
  53136,   # Автоматизация медицинских учреждений
  104043,  # Автоматизация предприятий общепита
  187,     # Информационная безопасность
  188,     # Программное обеспечение
  112624,  # Разработка программного обеспечения
  51755,   # Разработка мобильных приложений
  186,     # Бухгалтерские программы
  4456,    # Правовые программы
  50372,   # Электронные подписи

  # 110617 «Ещё» — HR и системное администрирование
  326,     # Кадровые агентства
  921,     # Системное администрирование
  668,     # Бизнес-тренинги
  16928,   # Тимбилдинг
  112620,  # Услуги фасовки и упаковки товаров
]

# Ветки, которые не таргетим никогда. 110611 «Реклама» — прямые конкуренты:
# рекламные агентства, PR, маркетинговые исследования, реклама в интернете.
# Здесь id ветки, а не листьев: список ведётся для человека и для склейки
# работодателей hh, где рубрики 2GIS нет и белый список не спасает.
exclude = [110611]

[hh]
# Транслитерация фразы, подтверждённая живым запросом к almaty.hh.kz/vacancies/{slug}:
# набор SEO-страниц у hh фиксирован, догадка без проверки молча уводит на /vacancies.
# Непроверенный slug сюда не попадает.
slugs = [
  # продажи — главный intent-сигнал по BRD: нанимают продавцов = не хватает клиентов
  "menedzher_po_prodazham",
  "rukovoditel_otdela_prodazh",
  "torgovyy_predstavitel",
  "menedzher_po_razvitiyu_biznesa",
  "menedzher_po_zakupkam",

  # бухгалтерия и аудит
  "bukhgalter",
  "auditor",

  # право
  "yurist",
  "yuriskonsult",

  # HR и рекрутинг
  "rekruter",
  "hr_menedzher",
  "menedzher_po_personalu",
  "specialist_po_podboru_personala",

  # IT-аутсорс
  "sistemnyy_administrator",
  "programmist",
  "razrabotchik",

  # консалтинг и маркетинг
  "biznes_analitik",
  "biznes_trener",
  "konsultant",
  "marketolog",
]

# У hh нет SEO-страницы под эти фразы — проверено, повторно не пробовать:
# specialist_po_prodazham, menedzher_prodazh, menedzher_po_rabote_s_klientami,
# glavnyy_bukhgalter, buhgalter (у hh х -> kh), uborschitsa, uborshchitsa,
# kliner, operator_call_centra, programmist_1s.

[scoring]
# Всё ниже — гипотеза до первых 30 ответов. Реакция живых людей переопределит
# половину весов; калибруется тогда, а не раньше.

# Затухание intent_score: вклад сигнала = weight * exp(-ln2 * days / half_life_days).
half_life_days = 90

[scoring.intent]
# ARCHITECTURE.md §10: высокий = 3.0, средний = 1.5, низкий = 0.5.
# Нет сигнала не значит отрицательный вес — просто ноль.
ads_platform = 3.0                 # Google Ads / Яндекс.Директ на сайте
crm_widget = 3.0                   # Bitrix24 / amoCRM — есть отдел продаж и процесс
reviews_missed_lead = 3.0          # отзывы «не дозвонились», «не ответили на заявку»
inbound_widget = 1.5               # форма заявки, WhatsApp-виджет
service_catalog = 0.5              # каталог услуг или прайс на сайте

# Инстаграм. Типы ig_* с суффиксом от модели приходят из schemas/ig_signals.py,
# остальные считаются по датам в enrich.py.
ig_dormant = 3.0                   # молчит дольше 60 дней — маркетинг заглох
ig_promo = 3.0                     # акция или скидка в подписи — тратит на привлечение
ig_hiring_sales = 3.0              # ищет продавца через инстаграм, минуя hh
ig_active_marketing = 1.5          # 8+ постов за квартал — есть кому вести аккаунт
# Не 3.0, хотя это и самый прямой признак ручного лидогена: призыв написать или
# позвонить есть у 56% аккаунтов замера, а признак, который стоит почти у всех,
# почти ничего не разделяет. Поднимать после первых 30 ответов, если окажется,
# что он всё-таки отличает откликнувшихся.
ig_direct_selling = 1.5            # «напишите в директ», телефон в подписи

[scoring.fit]
# Соответствие ICP по правилам: рубрика, город, наличие сайта.
rubric_in_include = 3.0
city_in_target = 2.0
has_website = 1.0

[llm]
# Провайдер OpenRouter. Модель проверить: uv run -m scripts.classify --models deepseek
# Имя модели входит в ключ кэша ответов, поэтому смена модели не портит уже
# оплаченные ответы — они просто перестают находиться и остаются лежать в raw/.
model = "deepseek/deepseek-v4-flash"
# Сколько компаний из верха выдачи классифицировать. Вся база не нужна: отрасль
# известна из рубрики, размер недостижим, отдел продаж виден по сигналам.
top_n = 40
# Потолок символов текста сайта в промпте — дальше идёт подвал и меню.
site_chars = 6000
