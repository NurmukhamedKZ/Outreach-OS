[project]
name = "writer"
version = "0.1.0"
description = "Система 2: агентная персонализация исходящей переписки"
requires-python = ">=3.13"
dependencies = [
    "langchain>=1.3.15",
    "langchain-openrouter>=0.2.8",
    # Только ради APIRouter в web.py: свой сервер writer не поднимает, роутер
    # монтируется в приложение collector'а. Зависимость объявлена честно, чтобы
    # `uv run -m web` из writer/ проверял тот же код, что исполняется в вебе.
    "fastapi>=0.141.1",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
