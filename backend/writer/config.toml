# Единственное место конфигурации системы 2, по образцу collector/config.toml.
# Лидов writer читает через research.public, своей базы лидов у него нет.

[llm]
# Та же модель, что у classify: проверена на русских текстах и дёшева.
model = "deepseek/deepseek-v4-flash"
# Не 0, как в classify: там извлечение фактов из готового текста, здесь —
# сообщение живому человеку, и нулевая температура даёт одинаковые письма.
temperature = 0.7
# Сколько новых лидов берёт «Черновики топ-N» (операция writer.outreach) за прогон.
top_n = 10

[signals]
# Типы, которые годятся как повод для письма. Остальные сигналы продолжают
# влиять на оценку research (компания с CRM и отделом продаж — лучший лид из
# возможных), но в промпт не идут: «у вас на сайте виджет CRM» — не боль.
# Что считать сигналом, решает research; о чём писать — writer, поэтому
# список живёт здесь, а не в настройках research.
pitchable = [
  "reviews_unanswered_complaint",
  "reviews_missed_lead",
  "ig_unanswered_question",
  "site_hiring_sales",
  "ig_reach_declining",
  "ig_dormant",
  "site_no_pricing",
]
# Наблюдение старше этого в промпт не попадает вовсе. Не затухание, а отсечка:
# «увидел, что вы ищете продажника» про вакансию трёхмесячной давности убивает
# доверие одним предложением.
max_age_days = 60

[offer]
# Оффер живёт текстом, а не в коде: смена продукта не должна требовать правки
# промпта. Модель обязана опираться на него и не выдумывать деталей сверх.
text = """
Мы строим систему исходящего лидогена под ключ: находим компании, которым
услуга нужна прямо сейчас (по вакансиям, рекламе, сайту и соцсетям), пишем
каждому персонально по его же ситуации и доводим до встречи.
Клиент даёт профиль своего покупателя и получает встречи в календаре, а не
список контактов. Работаем по Казахстану, первые результаты — за 2-3 недели.
"""

[[offer.variant]]
id   = "free_first_meetings"
text = """
Находим компании, которым ваша услуга нужна прямо сейчас, пишем каждой лично и
доводим до встречи. Первые две встречи — за наш счёт: платите только за те, что
состоялись после них. Списков контактов не продаём, работаем по Казахстану.
"""

[[offer.variant]]
id   = "pay_per_meeting"
text = """
Находим компании, которым ваша услуга нужна прямо сейчас, пишем каждой лично и
доводим до встречи. Оплата только за состоявшуюся встречу — не за письма, не за
базу, не помесячно. Работаем по Казахстану.
"""
