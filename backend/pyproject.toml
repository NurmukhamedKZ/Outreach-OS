[project]
name = "backend"
version = "0.1.0"
description = "Три системы продукта — один процесс"
requires-python = ">=3.13"
dependencies = [
    "scrapling[fetchers]>=0.4.12",
    # scrapling 0.4.12 просит Chrome 149, а датасет 0.14.0 знает максимум 143 ->
    # ValueError при импорте StealthySession. 0.15.0 чинит.
    "apify-fingerprint-datapoints>=0.15.0",
    "fastapi>=0.141.1",
    "uvicorn>=0.52.3",
    "langchain>=1.3.15",
    "langchain-openrouter>=0.2.8",
    "pydantic-settings>=2.15.0",
    "langfuse>=3.0.0",
    "httpx>=0.28",
    "alembic>=1.20.1",
]

[dependency-groups]
dev = [
    "import-linter>=2.16",
    "mypy>=2.4.1",
    "pytest>=8",
    "pytest-asyncio>=1.0",
    "ruff>=0.17.5",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["core/tests", "refusals/tests", "companies/tests", "research/tests",
             "conversations/tests", "delivery/tests", "backup/tests", "overview/tests",
             "sandbox/tests", "tests"]
asyncio_mode = "auto"
# Тесты разных модулей совпадают по базовым именам (test_api, test_migration,
# test_routes) — без importlib-режима pytest считает их одним модулем.
addopts = "--import-mode=importlib"

# Охват линтеров — новый код (#5): core, модули предметной области с миграциями,
# песочница (#39) и сборщик main.py. Прочие модули верхнего уровня backend/*.py не
# проверяются. Новый модуль включается в охват тем же PR, что его заводит.

[tool.ruff]
line-length = 100
target-version = "py313"
include = ["core/**/*.py", "refusals/**/*.py", "companies/**/*.py", "research/**/*.py",
           "conversations/**/*.py", "delivery/**/*.py", "backup/**/*.py", "overview/**/*.py",
           "sandbox/**/*.py", "migrations/**/*.py", "main.py"]

[tool.ruff.lint]
extend-select = ["I", "UP", "B", "SIM", "RUF"]
# RUF001-003: строки, docstring и комментарии — по-русски, кириллица и типографские
# тире с кавычками в них — данные и текст, а не подмена латиницы.
# PLC0414: `import X as X` — явный реэкспорт фасада, так его понимает mypy strict
# (implicit_reexport выключен).
ignore = ["RUF001", "RUF002", "RUF003", "PLC0414"]

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]
files = ["core", "refusals", "companies", "research", "conversations", "delivery", "backup",
         "overview", "sandbox", "migrations", "main.py"]

[tool.importlinter]
root_packages = ["core", "refusals", "companies", "research", "conversations", "delivery",
                 "backup", "overview", "sandbox"]
# Старые системы и модули верхнего уровня видны снаружи графа — одним узлом
# на имя, этого хватает для запретов ниже.
include_external_packages = true

# Тесты собирают данные чужими внутренностями (фикстуры, приложение
# main) — контракты описывают код модулей, а не их тесты.
[[tool.importlinter.contracts]]
name = "Слои: overview → delivery → conversations → research → companies → refusals | backup → core; refusals и backup зовут все"
type = "layers"
layers = ["overview", "delivery", "conversations", "research", "companies", "refusals | backup",
          "core"]
ignore_imports = ["*.tests.** -> **"]
unmatched_ignore_imports_alerting = "none"

[[tool.importlinter.contracts]]
name = "Модули не знают песочницы"
type = "forbidden"
allow_indirect_imports = true
source_modules = ["core", "refusals", "companies", "research", "conversations", "delivery",
                  "backup", "overview"]
forbidden_modules = ["sandbox"]
ignore_imports = ["*.tests.** -> **"]
unmatched_ignore_imports_alerting = "none"

[[tool.importlinter.contracts]]
name = "Журнал activity пишут backup и delivery, читает overview"
type = "forbidden"
allow_indirect_imports = true
source_modules = ["refusals", "companies", "research", "conversations", "sandbox"]
forbidden_modules = ["core.activity"]
ignore_imports = ["*.tests.** -> **"]
unmatched_ignore_imports_alerting = "none"

[[tool.importlinter.contracts]]
name = "companies: снаружи — только через public"
type = "protected"
protected_modules = ["companies.*"]
allowed_importers = ["companies"]
ignore_imports = ["** -> companies.public", "*.tests.** -> **"]
unmatched_ignore_imports_alerting = "none"

[[tool.importlinter.contracts]]
name = "refusals: снаружи — только через public"
type = "protected"
protected_modules = ["refusals.*"]
allowed_importers = ["refusals"]
ignore_imports = ["** -> refusals.public", "*.tests.** -> **"]
unmatched_ignore_imports_alerting = "none"

[[tool.importlinter.contracts]]
name = "backup: снаружи — только через public"
type = "protected"
protected_modules = ["backup.*"]
allowed_importers = ["backup"]
ignore_imports = ["** -> backup.public", "*.tests.** -> **"]
unmatched_ignore_imports_alerting = "none"

[[tool.importlinter.contracts]]
name = "research: снаружи — только через public"
type = "protected"
protected_modules = ["research.*"]
allowed_importers = ["research"]
ignore_imports = ["** -> research.public", "*.tests.** -> **"]
unmatched_ignore_imports_alerting = "none"

[[tool.importlinter.contracts]]
name = "delivery: снаружи — только через public"
type = "protected"
protected_modules = ["delivery.*"]
allowed_importers = ["delivery"]
ignore_imports = ["** -> delivery.public", "*.tests.** -> **"]
unmatched_ignore_imports_alerting = "none"

[[tool.importlinter.contracts]]
name = "overview: снаружи — только через public"
type = "protected"
protected_modules = ["overview.*"]
allowed_importers = ["overview"]
ignore_imports = ["** -> overview.public", "*.tests.** -> **"]
unmatched_ignore_imports_alerting = "none"

[[tool.importlinter.contracts]]
name = "conversations: снаружи — только через public"
type = "protected"
protected_modules = ["conversations.*"]
allowed_importers = ["conversations"]
ignore_imports = ["** -> conversations.public", "*.tests.** -> **"]
unmatched_ignore_imports_alerting = "none"

# Старые системы и модули верхнего уровня вне охвата: mypy читает их типы,
# но не сообщает их ошибок. Модуль уходит из списка, когда его переписывают (#7).
[[tool.mypy.overrides]]
module = ["clock", "config", "logging_setup", "llm_schema", "observability",
          "paths", "sqlite_tools", "tests.*"]
ignore_errors = true

# Тесты охвата: сигнатуры тестов и фикстур без аннотаций (аргументы-фикстуры — Any),
# тела проверяются — check_untyped_defs из strict остаётся. Решение main по #5.
[[tool.mypy.overrides]]
module = ["*.tests.*"]
disallow_untyped_defs = false
disallow_incomplete_defs = false
disallow_untyped_calls = false
