# Единственное место конфигурации системы 3, по образцу collector/config.toml
# и writer/config.toml. Пути относительны каталогу sender/, а не текущему:
# тот же конфиг читается и из sender/, и из backend/ (uvicorn монтирует
# роутеры sender'а в общее приложение).

state_db = "../collector/data/state.db"

[autopilot]
mode = "off"                    # off | replies | full; он же kill switch

[window]
timezone = "Asia/Almaty"
hours    = [10, 18]
weekdays = [1, 2, 3, 4, 5]

# Окно ответа в диалоге. Круглосуточно и всю неделю: лид написал сам и ждёт
# сейчас, а ответ, пришедший через пятнадцать часов, — это уже не диалог.
# Джиттер и дневной лимит номера при этом остаются: они защищают номер, а не
# покой лида. Часовой пояс наследуется от [window].
[window.reply]
hours    = [0, 24]
weekdays = [1, 2, 3, 4, 5, 6, 7]

[pace]
tick_seconds   = 20
jitter_minutes = [2, 15]

[cadence]
follow_up_days = [3, 7]
max_touches    = 3

[limits]
auto_replies_per_thread = 1
max_reply_chars         = 600
# Сколько раз тик пробует обработать одно входящее, прежде чем отдать тред
# человеку. Три, а не одна: сетевой таймаут не повод отдавать живой тред в
# ручной режим навсегда.
max_handle_attempts     = 3

[warmup]
socket_delay_hours = 24
passive_days       = 3
internal_ramp      = [6, 12, 20, 30, 45, 60]
cold_start_day     = 11
cold_ramp          = [5, 10, 15, 20, 25, 30]
ceiling            = 30
# Как часто просыпается прогрев. Одна отправка за тик: шесть сообщений подряд
# отличаются от живого общения ровно тем, из-за чего номера и банят.
tick_minutes       = 10
# Разброс вокруг тика. Отправки ровно в :00, :10, :20 — машинный почерк, а
# именно почерк здесь и оценивают.
tick_jitter_minutes = 4
# Как часто новый номер получает входящее в пассивной фазе (дни 2-4).
passive_interval_hours = 2
# Тексты внутренней переписки. Прогрев требует разнообразия: одинаковые
# сообщения между одними и теми же номерами — сами по себе сигнал.
phrases = [
  "привет, как дела",
  "созвонимся завтра?",
  "принял, спасибо",
  "хорошо, договорились",
  "буду через час",
  "ок, посмотрю и отвечу",
]
# Node-сервис поднимается отдельным процессом:
#   cd backend/sender/node && npm start
# Адрес, по которому его ищет Python, — settings.sender_node_url.

[health]
window_days              = 7
min_sample               = 20
min_delivered_rate       = 0.8
min_reply_rate           = 0.05
reconnects_per_day_alert = 5

[retry]
backoff_minutes     = [1, 5, 30]
stuck_after_minutes = 5

# Стоп-слова проверяются регуляркой ДО модели. Классификатор вероятностный, и
# его проценты ошибок приходятся ровно на раздражённые короткие сообщения — то
# есть на тех, кто и жмёт Report. Фрагменты, а не слова целиком: «отпиш»
# закрывает и «отпишите», и «отпишитесь».
[stopwords]
patterns = [
  "не пиши",
  "не писать",
  "отпиш",
  "удалите мой номер",
  "удалите номер",
  "спам",
  "жалоб",
  "отстань",
]
