# Alembic history for the new modules (ADR 0004). The app applies it itself on
# startup (core.db.migrate); the CLI is for writing revisions and checking heads.
[alembic]
script_location = %(here)s/migrations
prepend_sys_path = .
path_separator = os
file_template = %%(year)d-%%(month).2d-%%(day).2d_%%(slug)s
